[build-system]
requires = ["poetry-core>=2.2.1,<3"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "together"
version = "1.5.36"
authors = ["Together AI <support@together.ai>"]
description = "Python client for Together's Cloud Platform! Note: SDK 2.0 is now available at https://github.com/togethercomputer/together-py"
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
]
repository = "https://github.com/togethercomputer/together-python"
homepage = "https://github.com/togethercomputer/together-python"

[tool.poetry.dependencies]
python = "^3.11"
typer = ">=0.9,<0.20"
requests = "^2.33.0"
rich = ">=13.8.1,<15.0.0"
tqdm = "^4.70.1"
tabulate = "^0.9.0"
pydantic = "^2.14.1"
aiohttp = "^3.14.4"
filelock = ">=3.20.3,<5"
eval-type-backport = ">=0.1.3,<0.3.0"
click = "^8.1.7"
pyarrow = { version = ">=23.0.1", optional = true }
pillow = "^13.0.0"
# Security floors also apply to pip installs, which do not consume poetry.lock.
# These are transitive dependencies of requests and rich.
certifi = ">=2026.10.19"
urllib3 = "^2.8.0"
idna = "^3.15"
pygments = "^2.20.0"

[tool.poetry.extras]
pyarrow = ["pyarrow"]

[tool.poetry.group.quality]
optional = true

[tool.poetry.group.quality.dependencies]
black = ">=26.3.1,<27"
ruff = ">=0.3.2,<0.14.0"
types-tqdm = "^4.65.0.0"
types-tabulate = "^0.9.0.3"
pre-commit = "4.3.0"
types-requests = "^2.31.0.20240218"
pyarrow-stubs = ">=10.0.1.7,<20240831.0.0.0"
mypy = "^1.9.0"

[tool.poetry.group.tests]
optional = true

[tool.poetry.group.tests.dependencies]
pytest = ">=9.0.3,<10"
pytest-watch = "^4.2.0"
pytest-mock = "^3.14.0"
pytest-asyncio = "^1.4.0"
tox = "^4.67.1"
virtualenv = "^21.14.4"

[tool.poetry.group.examples]
optional = true

[tool.poetry.group.examples.dependencies]
datasets = ">=5.0.1,<6"
transformers = "^5.10.1"
fsspec = ">=2026.6.0"


[tool.poetry.urls]
"Homepage" = "https://github.com/togethercomputer/together-python"
"Bug Tracker" = "https://github.com/togethercomputer/together-python/issues"

[tool.poetry.scripts]
together = "together.cli.cli:main"

[tool.black]
target-version = ['py311']

[tool.ruff.lint]
# Never enforce `E501` (line length violations).
ignore = ["C901", "E501", "E741", "W605"]
select = ["C", "E", "F", "I", "W"]

# Ignore import violations in all `__init__.py` files.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["together"]

[tool.mypy]
strict = true
mypy_path = "."
